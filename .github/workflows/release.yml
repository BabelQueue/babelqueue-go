name: Release

on:
  push:
    tags:
      - "v*"                  # core module
      - "redis/v*"            # github.com/babelqueue/babelqueue-go/redis
      - "amqp/v*"             # github.com/babelqueue/babelqueue-go/amqp
      - "sqs/v*"              # github.com/babelqueue/babelqueue-go/sqs
      - "azureservicebus/v*"  # github.com/babelqueue/babelqueue-go/azureservicebus
      - "pulsar/v*"           # github.com/babelqueue/babelqueue-go/pulsar
      - "kafka/v*"            # github.com/babelqueue/babelqueue-go/kafka
      - "artemis/v*"          # github.com/babelqueue/babelqueue-go/artemis
      - "asynq/v*"            # github.com/babelqueue/babelqueue-go/asynq
      - "machinery/v*"        # github.com/babelqueue/babelqueue-go/machinery
      - "otel/v*"             # github.com/babelqueue/babelqueue-go/otel

permissions:
  contents: write

env:
  BQ_CONFORMANCE_VERSION: "1.8.0"
  # sha256 of that release's fetch.sh: the script runs on the runner, so it is pinned rather than
  # trusted from a mutable tag. Bump together with BQ_CONFORMANCE_VERSION.
  BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849

jobs:
  release:
    runs-on: ubuntu-latest
    # A Redis broker for the published results.json: the redis `live/*` conformance subtests must
    # run (BQ_REQUIRE_REDIS makes a missing broker fail), so the attested `redis#payload_identity`
    # is backed by a real broker, as in ci.yml.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      # The vendored suite must be byte-identical to the pinned conformance release, or the
      # results.json would attest a suite nobody can reproduce. The publish fails if it differs.
      - name: Verify vendored conformance matches the pinned release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" testdata/conformance

      # results.json is produced for the core tag only (`v*`, no module prefix): the core's
      # TestConformanceResults runs the core and every transport module's conformance sections
      # and writes it when BQ_CONFORMANCE_RESULTS is set (ADR-0032). A transport module tag
      # (`redis/v*`, ...) carries no results of its own.
      - name: Test core
        run: go test -race -count=1 ./...
        env:
          BQ_CONFORMANCE_RESULTS: ${{ !contains(github.ref_name, '/') && format('{0}/results.json', runner.temp) || '' }}
          BQ_REQUIRE_REDIS: "1"
          REDIS_URL: redis://localhost:6379/0

      # A module tag (`redis/v*`, `sqs/v*`, ...) publishes that module's own go.mod, which the
      # core test above does not exercise: run the module's build, vet and tests before anything is
      # released, as ci.yml does. The module directory is the tag's prefix; the case below accepts
      # only the modules the `on.push.tags` filter lists, so a stray prefix fails the release. The
      # core tag (`v*`, no prefix) skips this step and releases exactly as before.
      - name: Test module
        if: ${{ contains(github.ref_name, '/') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MODULE_DIR="${TAG%%/*}"
          case "$MODULE_DIR" in
            redis|amqp|sqs|azureservicebus|pulsar|kafka|artemis|asynq|machinery|otel) ;;
            *) echo "release: unknown module tag prefix '$MODULE_DIR'" >&2; exit 1 ;;
          esac
          cd "$MODULE_DIR"
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - uses: actions/setup-python@v7
        if: ${{ !contains(github.ref_name, '/') }}
        with:
          python-version: "3.12"

      # Schema-valid, no `fail`, bindings derived from the Go modules in the tree, and every
      # in-scope section and case present (an absent transport or section breaks the release).
      - name: Validate results.json
        if: ${{ !contains(github.ref_name, '/') }}
        run: |
          python3 -m pip install --quiet jsonschema==4.23.0
          python3 -I scripts/check-conformance-results.py "$RUNNER_TEMP/results.json" \
            testdata/conformance "$BQ_CONFORMANCE_VERSION"
          cp "$RUNNER_TEMP/results.json" results.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results.json

      # Go modules are served by the module proxy on tag; this nudges it to index
      # the tagged module (core or a transport submodule) so `go get` resolves it.
      - name: Warm the Go module proxy
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            redis/*)           MODULE="github.com/babelqueue/babelqueue-go/redis";           VER="${TAG#redis/}" ;;
            amqp/*)            MODULE="github.com/babelqueue/babelqueue-go/amqp";            VER="${TAG#amqp/}" ;;
            sqs/*)             MODULE="github.com/babelqueue/babelqueue-go/sqs";             VER="${TAG#sqs/}" ;;
            azureservicebus/*) MODULE="github.com/babelqueue/babelqueue-go/azureservicebus"; VER="${TAG#azureservicebus/}" ;;
            pulsar/*)          MODULE="github.com/babelqueue/babelqueue-go/pulsar";          VER="${TAG#pulsar/}" ;;
            kafka/*)           MODULE="github.com/babelqueue/babelqueue-go/kafka";           VER="${TAG#kafka/}" ;;
            artemis/*)         MODULE="github.com/babelqueue/babelqueue-go/artemis";         VER="${TAG#artemis/}" ;;
            asynq/*)           MODULE="github.com/babelqueue/babelqueue-go/asynq";           VER="${TAG#asynq/}" ;;
            machinery/*)       MODULE="github.com/babelqueue/babelqueue-go/machinery";       VER="${TAG#machinery/}" ;;
            *)                 MODULE="github.com/babelqueue/babelqueue-go";                 VER="$TAG" ;;
          esac
          GOPROXY=https://proxy.golang.org go list -m "${MODULE}@${VER}" || true
